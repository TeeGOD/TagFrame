<!DOCTYPE html>
{% load static %}
 <html lang="en">
     <link rel="preconnect" href="{% static 'style/bebas_regular.ttf' %}" as="font" type="font/ttf" crossorigin="use-credentials">
    <link rel="stylesheet" rel="preconnect" type="text/css" href="{% static 'style/style.css' %}">  
    <link rel="shortcut icon" type="image/png" href="{% static 'favicon.svg' %}">
<head>
    <title>TagFrame</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<header>
</header>

<body>
    <main>
        <div id="container">
            <div id="btnList">
                {% for character in character_list %}
                <button class="character_btn" style="background-color: transparent; border: none;">
                    <a class="a_main_menu" href="{% url 'character' %}?character={{ character.raw }}" style="margin: 0px">
                        <img rel="preload" fetchpriority="high" class="char_mugshot" src="{% static 'images/ig_render/mugshot/mugshot_'|add:character.raw|add:'.webp'|lower %}" alt={{character.raw}} style="width:56px; height:88px">
                    </a>
                </button>
                {% endfor %}
            </div>
        </div>
    </main>
    <footer>
        <a href={%url 'credit'%}>credit</a>
    </footer>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6570738798920510"
     crossorigin="anonymous"></script>
</body>
</html>
